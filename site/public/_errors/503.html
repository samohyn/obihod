<!--
  Обиход · сайт не отвечает — brand-guide §11.5 (502/504 → «Сервер не отозвался»).
  Отдаёт nginx с кодом 503 и Retry-After: 60, пока Next не отвечает (выкатка, сбой) —
  deploy/nginx/obikhod-errors.conf. Ничего не грузит с приложения: стили и знак внутри,
  шрифт — /_errors/golos.woff2 с диска. Контакты дублируют «Компания и контакты»
  (админка в этот момент недоступна) — сменили телефон или почту, поправьте и здесь.
-->

  header { border-bottom: 1px solid var(--c-line); }
  .bar { display: flex; align-items: center; gap: 16px; height: 64px; }
  @media (min-width: 768px) { .bar { height: 72px; } }
  @media (min-width: 1200px) { .bar { height: 80px; } }
  .logo { display: block; height: 40px; width: auto; color: var(--c-primary); }
  @media (min-width: 768px) { .logo { height: 48px; } }
  .tel-top { margin-left: auto; }
  main { flex: 1; padding: 48px 0 64px; }
  @media (min-width: 1200px) { main { padding: 72px 0 96px; } }
  .illu { display: block; width: 96px; height: 96px; margin-bottom: 24px; color: var(--c-primary); opacity: .85; }
  .eyebrow {
    margin: 0; display: inline-flex; align-items: center; gap: 10px;
    font: 500 12px/1.2 ui-monospace, 'SFMono-Regular', Menlo, monospace;
    letter-spacing: .12em; text-transform: uppercase; color: var(--c-muted-text);
  }
  .eyebrow::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--c-accent); flex: none; }
  h1 {
    margin: 16px 0 0; max-width: 900px;
    font-weight: 700; font-size: clamp(32px, 4.6vw, 56px); line-height: 1.04; letter-spacing: -.035em;
    text-wrap: balance;
  }
  .lead { margin: 18px 0 0; max-width: 720px; font-size: clamp(17px, 1.5vw, 19px); line-height: 1.55; color: var(--c-ink-soft); }
  .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    min-height: 48px; padding: 0 22px; border-radius: 10px; border: 1.5px solid transparent;
    font-family: inherit; font-weight: 600; font-size: 16px; line-height: 1.2; text-decoration: none; cursor: pointer;
    transition: background-color .2s, border-color .2s;
  }
  .btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--c-bg), 0 0 0 4px var(--c-accent); }
  .btn-primary { background: var(--c-primary); color: var(--c-on-primary); }
  .btn-primary:hover { background: var(--c-primary-ink); }
  .btn-ghost { border-color: var(--c-primary); color: var(--c-primary); background: transparent; }
  .btn-ghost:hover { background: rgba(45, 90, 61, .06); }
  .btn svg { width: 20px; height: 20px; flex: none; }
  .fallback {
    margin: 32px 0 0; padding-top: 16px; max-width: 720px;
    border-top: 1px dashed var(--c-line); font-size: 15px; line-height: 1.55; color: var(--c-muted-text);
  }
  .fallback a { color: var(--c-primary); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; white-space: nowrap; }
  @media (max-width: 479px) {
    .tel-top span { display: none; }
    .tel-top { padding: 0 13px; }
    .actions > * { flex: 1 1 100%; }
  }
  @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
