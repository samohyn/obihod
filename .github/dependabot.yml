version: 2

updates:
  # npm dependencies для сайта
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 5
    labels:
      - dependencies
    # Типы Node держим под рантайм (.nvmrc = 22): мажор выше разрешит API, которых на сервере нет.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # `typescript` — 6.0.x: typescript-eslint и next build работают через JS API, которого нет в
      # TypeScript 7 (peer typescript-eslint — <6.1). TypeScript 7 стоит отдельно как `typescript-7`
      # и проверяет типы в CI. Снять, когда typescript-eslint поддержит 7.
      - dependency-name: 'typescript'
        versions: ['>=6.1.0']
    groups:
      # Next.js + Payload апдейтим одной пачкой — у них связанные версии
      next-payload:
        patterns:
          - "next"
          - "@payloadcms/*"
          - "payload"
      # Линтеры/форматтеры — одна группа, чтобы не дробить PR
      tooling:
        patterns:
          - "eslint"
          - "eslint-config-*"
          - "eslint-plugin-*"
          - "prettier"
          - "prettier-plugin-*"
          - "typescript"
          - "@types/*"
      # Тестовая инфра
      testing:
        patterns:
          - "@playwright/*"
          - "tsx"

  # GitHub Actions в workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 3
    labels:
      - ci
      - dependencies
