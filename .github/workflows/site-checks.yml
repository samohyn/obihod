name: Site checks (staging / prod)

# Проверки живого сайта (план 09, этап 1 — CI-проверки):
#   - после каждой выкатки на staging (workflow «Deploy to staging»);
#   - ночью на проде (04:17 МСК) — только чтение, без заявок, один поток;
#   - вручную — на выбор.
#
# Что проверяется (tests/site + скрипты):
#   - сторож индексации: до запуска сайт закрыт (noindex + Disallow: /) — правило 3 плана 09;
#   - шаблоны (по URL каждого типа × 360/768/1280/1440): статус и JS-ошибки — гейт;
#     горизонтальный скролл, axe serious/critical, консоль — в сводке запуска (гейтом станут
#     после эталонов этапа 3); скриншоты — в артефакте site-checks-report;
#   - краулер внутренних ссылок по всему сайту и JSON-LD по sitemap — гейт;
#   - staging: тестовая заявка через форму контактов (писем на staging нет).
# Сбой → GitHub присылает письмо владельцу репозитория.

on:
  workflow_run:
    workflows: ['Deploy to staging']
    types: [completed]
  schedule:
    # не ровно в начале часа: такие запуски GitHub чаще откладывает и пропускает
    - cron: '17 1 * * *' # 04:17 МСК — после бэкапа (03:30)
  workflow_dispatch:
    inputs:
      target:
        description: 'Где проверять'
        type: choice
        options: [staging, prod]
        default: staging

permissions:
  contents: read

# Проверки staging не пересекаются с выкаткой на staging (общая группа с deploy-staging.yml).
concurrency:
  group: ${{ (github.event_name == 'schedule' || inputs.target == 'prod') && 'site-checks-prod' || 'deploy-staging' }}
  cancel-in-progress: false

jobs:
  checks:
    name: Проверки ${{ (github.event_name == 'schedule' || inputs.target == 'prod') && 'прода' || 'staging' }}
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: site
    env:
      TARGET: ${{ (github.event_name == 'schedule' || inputs.target == 'prod') && 'prod' || 'staging' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: site/package.json
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('site/pnpm-lock.yaml') }}-chromium

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Адрес и доступ
        env:
          STAGING_BASIC_AUTH: ${{ secrets.STAGING_BASIC_AUTH }}
        run: |
          if [ "$TARGET" = prod ]; then
            echo "SITE_CHECK_URL=https://obikhod.ru" >> "$GITHUB_ENV"
          else
            [ -n "$STAGING_BASIC_AUTH" ] || { echo "::error::нет секрета STAGING_BASIC_AUTH"; exit 1; }
            echo "::add-mask::${STAGING_BASIC_AUTH#*:}"
            echo "SITE_CHECK_URL=https://staging.obikhod.ru" >> "$GITHUB_ENV"
            echo "SITE_AUTH=$STAGING_BASIC_AUTH" >> "$GITHUB_ENV"
            echo "SITE_ALLOW_WRITES=1" >> "$GITHUB_ENV"
          fi
          echo "SITE_SUMMARY_FILE=$RUNNER_TEMP/templates.md" >> "$GITHUB_ENV"

      - name: Сторож индексации, шаблоны, тестовая заявка
        env:
          # До запуска сайт обязан быть закрыт. Открытие — только командой владельца,
          # тогда здесь ставится '0'.
          SITE_EXPECT_NOINDEX: '1'
        run: pnpm exec playwright test -c playwright.site.config.ts

      - name: Ссылки — краулер по всему сайту
        if: ${{ !cancelled() }}
        run: pnpm run check:links "$SITE_CHECK_URL"

      - name: Title и description — пустые, дубли, длина
        if: ${{ !cancelled() }}
        run: pnpm run check:meta "$SITE_CHECK_URL"
      - name: JSON-LD по sitemap
        if: ${{ !cancelled() }}
        run: pnpm run lint:schema --url "$SITE_CHECK_URL" --sample 40

      - name: Сводка по шаблонам
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## Шаблоны: $SITE_CHECK_URL"
            echo
            [ -f "$SITE_SUMMARY_FILE" ] && cat "$SITE_SUMMARY_FILE" || echo "_сводки нет — шаблоны не проверялись_"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-checks-report-${{ env.TARGET }}
          path: site/playwright-report-site/
          retention-days: 14
