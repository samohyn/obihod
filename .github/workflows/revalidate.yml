name: Revalidate ISR (on-demand)

# Ручной сброс кеша всего сайта на проде — POST /api/revalidate/.
#
# Правки из админки (публикация, снятие с публикации, удаление, глобалы, медиа)
# сбрасывают кеш сами — хуки site/lib/admin/revalidateSite.ts; seed и скрипты
# данных — сами через scripts/_site-revalidate.ts. Этот workflow — на крайний
# случай (ручная правка базы и т. п.).
#
# paths — адреса для IndexNow; без INDEXNOW_KEY на сервере ничего не отправляется
# (индексация — только по команде владельца).

on:
  workflow_dispatch:
    inputs:
      paths:
        description: 'Адреса через запятую для IndexNow (необязательно). Пример: /vyvoz-musora/,/arboristika/'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: revalidate
  cancel-in-progress: false

jobs:
  revalidate:
    name: Revalidate
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: POST /api/revalidate/
        env:
          RVS: ${{ secrets.REVALIDATE_SECRET }}
          PATHS: ${{ inputs.paths }}
        run: |
          if [ -z "$RVS" ]; then
            echo "::error::REVALIDATE_SECRET пуст в GitHub Secrets"
            exit 1
          fi
          # Слеш в конце обязателен — trailingSlash: true делает 308 с /api/revalidate.
          URL="https://obikhod.ru/api/revalidate/"
          SEP='?'
          IFS=',' read -ra ARR <<< "$PATHS"
          for p in "${ARR[@]}"; do
            p="$(echo "$p" | xargs)"
            [ -n "$p" ] && URL="${URL}${SEP}url=$(printf '%s' "$p" | python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.stdin.read()))')" && SEP='&'
          done
          echo ">> $URL"
          RESP=$(curl -sS -X POST -w "\nHTTP_CODE:%{http_code}\n" -H "x-revalidate-secret: $RVS" "$URL")
          echo "$RESP"
          CODE=$(echo "$RESP" | grep '^HTTP_CODE:' | cut -d: -f2)
          if [ "$CODE" != "200" ]; then
            echo "::error::revalidate returned $CODE"
            exit 1
          fi
