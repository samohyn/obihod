name: Deploy to prod

# План 09, этап 1: выкатка на VPS 89.111.141.79 после мержа в main.
#
# Вся серверная логика — /usr/local/sbin/obikhod-deploy (deploy/server/obikhod-deploy.sh): бэкап,
# сборка, переключение, health-check с откатом, чистка релизов. Ключ DEPLOY_SSH_KEY в
# /root/.ssh/authorized_keys ограничен forced command — он умеет только «deploy <sha>».
# Обновился deploy/server/obikhod-deploy.sh — один раз выкатить вручную (deploy/manual-deploy.sh
# ставит скрипт на сервер), ключ CI ставить его не может.
#
# Миграции БД сюда не входят: применить psql ДО мержа PR (ADR-0016).

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

env:
  HOST: 89.111.141.79
  # публичный ключ сервера (ssh-keyscan -t ed25519), не секрет — закреплён от подмены
  HOST_KEY: '89.111.141.79 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIF/PwpJIXiUp6BNluOBsFfp7kpLUOhyET+bp0MH7DlWN'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          [ -n "$DEPLOY_SSH_KEY" ] || { echo "::error::нет секрета DEPLOY_SSH_KEY"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts

      - name: Deploy
        run: |
          git archive --format=tar.gz "$GITHUB_SHA" site | ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "root@$HOST" "deploy $GITHUB_SHA"

      - name: Smoke
        run: |
          fail=0
          for p in / /arboristika/ /kalkulyator/foto-smeta/ /admin/login/ /api/health/; do
            code=$(curl -s --max-time 20 -o /dev/null -w '%{http_code}' "https://obikhod.ru$p" || true)
            printf '%-28s %s\n' "$p" "$code"
            [ "$code" = 200 ] || fail=1
          done
          exit $fail
