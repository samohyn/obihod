name: Deploy to prod

# План 09: выкатка на VPS 89.111.141.79 после мержа в main (изменения в site/**) или вручную.
# Сборка — в _build-deploy.yml: компиляция здесь, на сервере только генерация страниц из базы.
# Обновился deploy/server/obikhod-deploy.sh — поставить его на сервер (deploy/manual-deploy.sh
# делает это сам), ключ CI ставить его не может.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/_build-deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: На прод — только main
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::на прод выкатывается только main (сейчас ${{ github.ref }})"
          exit 1
      - run: echo "main → prod"

  deploy:
    needs: guard
    uses: ./.github/workflows/_build-deploy.yml
    with:
      target: prod
    secrets:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
