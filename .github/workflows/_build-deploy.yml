name: Build and deploy

# Общая выкатка для «Deploy to prod» и «Deploy to staging» (план 09, техдолг, 23.10.2026).
#
# Тяжёлая часть сборки — здесь, а не на сервере, где работает прод (2 CPU, 4 ГБ):
# `next build --experimental-build-mode=compile` без базы, затем архив исходников вместе с `.next`
# (без кеша) уходит на сервер. Там /usr/local/sbin/obikhod-deploy (deploy/server/obikhod-deploy.sh):
# бэкап → pnpm install → миграции → только генерация страниц из базы
# (`--experimental-build-mode=generate`) → переключение, health-check с откатом. Базу GitHub не видит.
#
# NEXT_PUBLIC_SITE_URL вшивается при компиляции — своё значение у каждой цели; сервер сверяет его
# со своим .env (.next/obikhod-prebuilt.json) и при расхождении собирает целиком сам.
# Ключ DEPLOY_SSH_KEY ограничен forced command — умеет только «deploy <sha> [prod|staging]».

on:
  workflow_call:
    inputs:
      target:
        type: string
        required: true
      ref:
        description: 'Ветка, тег или SHA (по умолчанию — коммит вызова)'
        type: string
        default: ''
    secrets:
      DEPLOY_SSH_KEY:
        required: true

permissions:
  contents: read

env:
  HOST: 89.111.141.79
  # публичный ключ сервера (ssh-keyscan -t ed25519), не секрет — закреплён от подмены
  HOST_KEY: '89.111.141.79 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIF/PwpJIXiUp6BNluOBsFfp7kpLUOhyET+bp0MH7DlWN'
  TARGET: ${{ inputs.target }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: site/package.json
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install deps
        working-directory: site
        run: pnpm install --frozen-lockfile

      # Компиляция без базы: пререндер страниц — на сервере. DATABASE_URI и PAYLOAD_SECRET здесь
      # заглушки: compile-режим к базе не подключается (проверено на Next 16.4).
      - name: Compile
        working-directory: site
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_SITE_URL: ${{ inputs.target == 'staging' && 'https://staging.obikhod.ru' || 'https://obikhod.ru' }}
          DATABASE_URI: postgres://compile:only@127.0.0.1:1/none
          PAYLOAD_SECRET: compile-only-not-a-secret
        run: |
          pnpm exec next build --experimental-build-mode=compile
          printf '{"sha":"%s","siteUrl":"%s"}\n' "$(git rev-parse HEAD)" "$NEXT_PUBLIC_SITE_URL" > .next/obikhod-prebuilt.json
          du -sh --exclude=cache .next

      - name: Package
        run: |
          git archive --format=tar HEAD site > release.tar
          tar --append -f release.tar --exclude='site/.next/cache' site/.next
          gzip -1 release.tar
          ls -lh release.tar.gz

      - name: SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          [ -n "$DEPLOY_SSH_KEY" ] || { echo "::error::нет секрета DEPLOY_SSH_KEY"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts

      - name: Deploy
        run: |
          SHA=$(git rev-parse HEAD)
          echo "$TARGET ← $SHA (${{ inputs.ref || github.ref_name }})"
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "root@$HOST" "deploy $SHA $TARGET" < release.tar.gz

      - name: Smoke
        if: ${{ inputs.target == 'prod' }}
        run: |
          fail=0
          for p in / /arboristika/ /kalkulyator/foto-smeta/ /admin/login/ /api/health/; do
            code=$(curl -s --max-time 20 -o /dev/null -w '%{http_code}' "https://obikhod.ru$p" || true)
            printf '%-28s %s\n' "$p" "$code"
            [ "$code" = 200 ] || fail=1
          done
          exit $fail
