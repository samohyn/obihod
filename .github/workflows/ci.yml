name: CI

# Проверки на каждом PR (план 09, этап 1 — CI-проверки). Одна prod-сборка на чистой БД:
#   quality — type-check, lint, format, unit-тесты, TOV;
#   e2e     — схема БД и админ → build → next start → Playwright (формы и /api/leads, axe,
#             здоровье страниц, главная, шапка/подвал, SEO, админка) → JSON-LD → Lighthouse.
# Шаблоны с контентом (pillar, подуслуга, гео…) и краулер ссылок — на живом сайте после выкатки
# на staging и ночью на проде (site-checks.yml): в чистой CI-базе меню ведёт на несуществующие
# страницы услуг и районов, краулер здесь бессмыслен.
# Actions закреплены по SHA (версия — в комментарии), обновляет Dependabot.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DATABASE_URI: postgres://obikhod:obikhod_dev@localhost:5432/obikhod
  PAYLOAD_SECRET: ci-secret-do-not-use-in-production-32bytes
  SITE_URL: http://localhost:3000
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  REVALIDATE_SECRET: ci-revalidate-secret
  INDEXNOW_KEY: 00000000000000000000000000000000
  # Админ чистой CI-базы: создаёт scripts/seed-admin.ts, им тесты читают заявки.
  ADMIN_EMAIL: ci@obikhod.test
  ADMIN_PASSWORD: ci-test-password-12345

jobs:
  quality:
    name: Lint · Type-check · Format · Unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: site/package.json
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm run type-check

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Unit-тесты
        run: pnpm run test:unit

      - name: TOV-check (anti-patterns)
        run: |
          files=$(find ../seosite -name '*.md' -not -path '*/node_modules/*' 2>/dev/null | head -50 || true)
          if [ -z "$files" ]; then
            echo "[ci] no .md files to check yet — skipping tov-check"
            exit 0
          fi
          pnpm run tov:check $files

  e2e:
    name: Build · E2E · axe · JSON-LD · Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: site
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: obikhod
          POSTGRES_PASSWORD: obikhod_dev
          POSTGRES_DB: obikhod
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: site/package.json
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('site/pnpm-lock.yaml') }}-chromium

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Cache Next.js build (.next/cache)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: site/.next/cache
          key: next-cache-${{ runner.os }}-${{ hashFiles('site/pnpm-lock.yaml') }}-${{ hashFiles('site/**/*.ts', 'site/**/*.tsx', 'site/next.config.ts') }}
          restore-keys: |
            next-cache-${{ runner.os }}-${{ hashFiles('site/pnpm-lock.yaml') }}-
            next-cache-${{ runner.os }}-

      # Payload на старте создаёт схему по конфигу (push: NODE_ENV ≠ production) — без
      # прогрева dev-сервером. Переход на «миграции с нуля + нет дрейфа» — задача
      # «Дрейф схемы» (план 09, этап 1).
      - name: Схема БД и админ
        timeout-minutes: 3
        run: pnpm exec tsx --require=./scripts/_payload-cjs-shim.cjs scripts/seed-admin.ts

      - name: Build
        timeout-minutes: 8
        run: pnpm run build

      - name: Start Next.js
        id: start
        run: |
          pnpm run start > server.log 2>&1 &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 60); do
            curl -fsS http://localhost:3000/api/health/ -o /dev/null && { echo "server up after ${i}s"; exit 0; }
            sleep 1
          done
          echo "::error::next start не поднялся за 60 с"
          cat server.log
          exit 1

      # Дальше каждая проверка идёт, даже если предыдущая упала, — видно все проблемы сразу.
      - name: Playwright — формы, /api/leads, axe, здоровье страниц, SEO, админка
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          PLAYWRIGHT_EXTERNAL_SERVER: '1'
        run: pnpm exec playwright test

      - name: JSON-LD
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        run: pnpm run lint:schema --url http://localhost:3000 --sample 10

      # После Playwright, а не параллельно: иначе замеры шумят. 3 прогона, медиана;
      # LCP/CLS/производительность — пока предупреждения (лабораторный замер на раннере),
      # SEO — ошибка. Отчёты — в артефакте lighthouse-report.
      - name: Lighthouse — главная и контакты
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        run: pnpm dlx @lhci/cli@0.15.1 autorun

      - name: Stop Next.js
        if: always()
        run: kill "$SERVER_PID" 2>/dev/null || true

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: site/playwright-report/
          retention-days: 14

      - name: Upload Lighthouse report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-report
          path: site/.lighthouseci/
          retention-days: 14

      - name: Upload server log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-log
          path: site/server.log
          retention-days: 7
