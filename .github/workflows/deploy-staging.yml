name: Deploy to staging

# План 09, этап 1: выкатка любой ветки на https://staging.obikhod.ru (пароль у владельца) —
# показать владельцу до мержа. Запуск: Actions → Deploy to staging → Run workflow (ref),
# или `gh workflow run deploy-staging.yml -f ref=<ветка>`.
# Сборка — в _build-deploy.yml (компиляция здесь, на сервере только генерация страниц), тот же
# ключ DEPLOY_SSH_KEY и тот же /usr/local/sbin/obikhod-deploy, цель staging (своя папка,
# БД obikhod_staging, pm2 obikhod-staging, без писем и Telegram). После выкатки сами запускаются
# проверки живого сайта (site-checks.yml).
# Данные staging обновляет `obikhod-staging-refresh` на сервере (копия прода, заявки обезличены).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ветка, тег или SHA'
        required: true
        default: 'main'

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/_build-deploy.yml
    with:
      target: staging
      ref: ${{ inputs.ref }}
    secrets:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
